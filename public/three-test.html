<!doctype html>
<meta charset="utf-8" />
<body style="margin:0;background:#0D0C08">
<script type="importmap">

</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(600, 400);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#0D0C08");
const camera = new THREE.PerspectiveCamera(40, 1.5, 0.1, 100);
camera.position.set(2.5, 1.6, 2.5);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dir = new THREE.DirectionalLight(0xfff1d6, 1.4);
dir.position.set(5, 7, 4);
scene.add(dir);

// control cube (should be clearly lit)
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(0.5, 0.5, 0.5),
  new THREE.MeshStandardMaterial({ color: "#4A4438", metalness: 0.15, roughness: 0.55 })
);
cube.position.set(-1.2, 0.25, 0);
scene.add(cube);

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
loader.load("/models/chassis.glb", (gltf) => {
  const mat = new THREE.MeshStandardMaterial({
    color: "#4A4438", metalness: 0.15, roughness: 0.55, side: THREE.DoubleSide,
  });
  gltf.scene.traverse((n) => { if (n.isMesh) n.material = mat; });
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const c = box.getCenter(new THREE.Vector3());
  const s = 2.0 / box.getSize(new THREE.Vector3()).length();
  gltf.scene.position.sub(c).multiplyScalar(s);
  gltf.scene.scale.setScalar(s);
  scene.add(gltf.scene);
  renderer.render(scene, camera);

  // sample brightness in model region (center) and cube region (left)
  const gl = renderer.getContext();
  const px = new Uint8Array(600 * 400 * 4);
  gl.readPixels(0, 0, 600, 400, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const sample = (x0, x1, y0, y1) => {
    let s2 = 0, n2 = 0;
    for (let y = y0; y < y1; y += 2) for (let x = x0; x < x1; x += 2) {
      const i = (y * 600 + x) * 4; s2 += px[i] + px[i+1] + px[i+2]; n2++;
    }
    return (s2 / n2 / 3).toFixed(1);
  };
  console.log("RESULT model-region:", sample(250, 420, 130, 270), "cube-region:", sample(60, 200, 130, 270));
}, undefined, (e) => console.log("LOADERR", e.message));
</script>
